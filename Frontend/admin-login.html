<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - ChequeBook</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="admin-login-page">

    <!-- ADMIN LOGIN PAGE -->

    <main class="admin-login-wrapper">

        <section class="admin-login-card">

            <!-- BRAND -->

            <div class="admin-brand">

                <div class="admin-brand-icon">
                    ₹
                </div>

                <h1>ChequeBook</h1>

                <p>
                    Digital Banking Platform
                </p>

            </div>


            <!-- TITLE -->

            <div class="admin-login-heading">

                <span>SECURE ACCESS</span>

                <h2>Admin Login</h2>

                <p>
                    Sign in to manage customer accounts and cheque book requests.
                </p>

            </div>


            <!-- LOGIN FORM -->

            <form id="adminLoginForm">

                <!-- EMAIL -->

                <div class="admin-input-group">

                    <label for="adminEmail">
                        Admin Email
                    </label>

                    <input
                        type="email"
                        id="adminEmail"
                        placeholder="Enter admin email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="admin-input-group">

                    <label for="adminPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Enter admin password"
                        required
                    >

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="admin-login-btn"
                >
                    Login to Admin Portal
                </button>

            </form>


            <!-- MESSAGE -->

            <p id="adminLoginMessage"></p>


            <!-- BACK LINK -->

            <div class="admin-back-link">

                <span>Customer Login?</span>

                <a href="index.html">
                    Go to Customer Login
                </a>

            </div>


            <!-- SECURITY NOTE -->

            <div class="admin-security-note">

                <span class="security-icon">
                    ✓
                </span>

                <div>
                    <strong>Secure Administration</strong>

                    <p>
                        Authorized administrators only.
                    </p>
                </div>

            </div>

        </section>

    </main>


    <script src="admin-login.js"></script>

</body>

</html>
